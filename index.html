<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview prep</title>
<link rel="stylesheet" href="styles.css">
<script>
  /* Applied before first paint so the chosen theme never flashes. Three states:
     "light" and "dark" are explicit; absent means follow the OS. */
  try {
    var t = localStorage.getItem('prep-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/dsa">
      <span class="brand-name">Interview prep</span>
      <span class="brand-sub">Senior SWE, Web &middot; Google</span>
    </a>

    <nav class="nav" aria-label="Sections">
      <a class="nav-a" data-sec="dsa" href="#/dsa">DSA</a>
      <a class="nav-a" data-sec="reflexes" href="#/reflexes">Reflexes</a>
      <a class="nav-a" data-sec="problems" href="#/problems">Problems</a>
      <a class="nav-a" data-sec="frontend" href="#/frontend">Front-end</a>
      <a class="nav-a" data-sec="design" href="#/design">System design</a>
      <a class="nav-a" data-sec="behaviour" href="#/behaviour">Googleyness</a>
    </nav>

    <div class="tools">
      <input id="q" type="search" placeholder="Filter&hellip;" aria-label="Filter this page">
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" data-theme="auto" title="Follow system">Auto</button>
        <button type="button" data-theme="light" title="Light">Light</button>
        <button type="button" data-theme="dark" title="Dark">Dark</button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="side" id="side" aria-label="In this section"></aside>
  <main class="doc" id="main"></main>
</div>

<script src="data/base.js"></script>
<script src="data/tiers.js"></script>
<script src="data/patterns.js"></script>
<script src="data/structures.js"></script>
<script src="data/reflexes.js"></script>
<script src="data/problems.js"></script>
<script src="data/frontend.js"></script>
<script src="app.js"></script>
</body>
</html>
